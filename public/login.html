<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PortFlow·AI 로그인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh; background: #F4F1EA; color: #2B241C;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 340px; background: #FFFFFF; border: 1px solid #E4DDCC;
    border-radius: 16px; padding: 28px 24px;
  }
  .logo { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; letter-spacing: 0.2px; margin-bottom: 24px; text-align: center; }
  .logo span { color: #D97757; }
  label { display: block; font-size: 12px; color: #7A6F5E; margin-bottom: 6px; }
  input {
    width: 100%; background: #ECE6D8; border: 1px solid #E4DDCC; border-radius: 8px;
    padding: 12px 14px; color: #2B241C; font-size: 14px; margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #D97757; }
  button {
    width: 100%; background: #D97757; color: #FFFFFF; border: none; border-radius: 99px;
    padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .error {
    background: #BC4B3C18; border: 1px solid #BC4B3C40; color: #BC4B3C;
    border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-bottom: 16px; display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">PORTFLOW<span>·AI</span></div>
    <div class="error" id="err">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <form method="POST" action="/api/login">
      <label for="user">아이디</label>
      <input type="text" id="user" name="user" autocomplete="username" required />
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button type="submit">로그인</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error") === "1") {
      document.getElementById("err").classList.add("show");
    }
  </script>
</body>
</html>
